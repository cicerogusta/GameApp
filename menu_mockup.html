<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOID EATER - Menu Principal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .background {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            z-index: -1;
        }

        .glow-bg {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 217, 255, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: pulse 4s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes pulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.5;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.1);
                opacity: 0.8;
            }
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 40px;
            max-width: 600px;
        }

        .title {
            font-size: 80px;
            font-weight: bold;
            color: #00d9ff;
            text-shadow: 0 0 20px #00d9ff, 0 0 40px #00d9ff, 0 0 60px #9d00ff;
            margin-bottom: 10px;
            letter-spacing: 3px;
            animation: glow-pulse 2s ease-in-out infinite;
        }

        @keyframes glow-pulse {
            0%, 100% {
                text-shadow: 0 0 20px #00d9ff, 0 0 40px #00d9ff;
            }
            50% {
                text-shadow: 0 0 20px #00d9ff, 0 0 40px #00d9ff, 0 0 60px #9d00ff;
            }
        }

        .tagline {
            font-size: 18px;
            color: #9d00ff;
            margin-bottom: 40px;
            letter-spacing: 2px;
            opacity: 0.9;
        }

        .separator {
            height: 2px;
            background: linear-gradient(90deg, transparent, #00d9ff, transparent);
            margin-bottom: 30px;
        }

        .stats {
            color: #ffff00;
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.8;
            background: rgba(0, 217, 255, 0.05);
            padding: 20px;
            border-left: 3px solid #00d9ff;
            border-right: 3px solid #9d00ff;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 40px;
        }

        .btn {
            padding: 18px 40px;
            font-size: 22px;
            font-weight: bold;
            border: 3px solid;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-start {
            color: #00d9ff;
            border-color: #00d9ff;
            background: rgba(0, 217, 255, 0.1);
        }

        .btn-start:hover {
            background: rgba(0, 217, 255, 0.3);
            box-shadow: 0 0 20px #00d9ff, inset 0 0 10px rgba(0, 217, 255, 0.2);
            transform: scale(1.05);
        }

        .btn-quit {
            color: #ff0066;
            border-color: #ff0066;
            background: rgba(255, 0, 102, 0.1);
        }

        .btn-quit:hover {
            background: rgba(255, 0, 102, 0.3);
            box-shadow: 0 0 20px #ff0066, inset 0 0 10px rgba(255, 0, 102, 0.2);
            transform: scale(1.05);
        }

        .version {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #888;
            font-size: 12px;
        }

        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="background">
        <div class="glow-bg"></div>
        <div class="stars" id="stars"></div>
    </div>

    <div class="container">
        <div class="title">VOID EATER</div>
        <div class="tagline">Consume. Evolve. Ascend.</div>

        <div class="separator"></div>

        <div class="stats">
            <div>Melhor Wave: 0</div>
            <div>Moedas Totais: 0</div>
        </div>

        <div class="buttons-container">
            <button class="btn btn-start" onclick="startGame()">Iniciar Jogo</button>
            <button class="btn btn-quit" onclick="quitGame()">Sair</button>
        </div>

        <div class="version">v1.0 - Alpha</div>
    </div>

    <script>
        // Gerar estrelas aleatórias
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                starsContainer.appendChild(star);
            }
        }

        function startGame() {
            alert('🎮 Jogo iniciando...\n\nExecute: godot --run project.godot');
        }

        function quitGame() {
            alert('👋 Até logo!');
        }

        // Inicializar
        createStars();
    </script>
</body>
</html>
